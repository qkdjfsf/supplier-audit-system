<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Supplier Quality Audit System</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: #f4f6f8;
      color: #202933;
    }

    header {
      padding: 30px;
      background: #172331;
      color: white;
      border-bottom: 5px solid #6f8f5e;
    }

    main {
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px;
    }

    section {
      margin-bottom: 20px;
      padding: 25px;
      background: white;
      border: 1px solid #d9dee5;
      border-radius: 12px;
    }

    h1,
    h2 {
      margin-top: 0;
    }

    .success {
      padding: 18px;
      background: #eaf1e5;
      border-left: 5px solid #6f8f5e;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <header>
    <h1>Supplier Quality Audit System</h1>
    <p>BP社 품질 심사 및 분석 시스템</p>
  </header>

  <main>
    <section class="success">
      <strong>홈페이지 배포 테스트에 성공했습니다.</strong><br>
      이 화면이 보이면 GitHub와 Vercel 연결이 정상적으로 완료된 것입니다.
    </section>

    <section>
      <h2>BP社 Profile</h2>
      <p>회사 기본정보 입력 화면이 들어갈 예정입니다.</p>
    </section>

    <section>
      <h2>Quality Audit Sections</h2>
      <p>Section 6부터 Section 13까지의 심사 체크시트가 들어갈 예정입니다.</p>
    </section>
  </main>
</body>
</html>
